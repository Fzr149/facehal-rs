name: build-facehal
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          sed -i 's|send_authentication_frame(&callback, status);|if frame_status_due(status) { send_authentication_frame(\&callback, status); }|' rust/service/src/session.rs
          cat >> rust/service/src/session.rs <<'EOF'

          fn frame_status_due(status: i32) -> bool {
              static LAST: Mutex<Option<(i32, Instant)>> = Mutex::new(None);
              let mut last = LAST.lock().unwrap();
              let due = match *last {
                  Some((s, t)) => s != status || t.elapsed() >= Duration::from_millis(1000),
                  None => true,
              };
              if due {
                  *last = Some((status, Instant::now()));
              }
              due
          }
          EOF
          grep -n frame_status_due rust/service/src/session.rs
      - name: build
        run: |
          sed -i 's/-Werror/-Wno-error/' scripts/build-production.sh
          sed -i 's|"--cfg", "android_vendor",|"--cfg", "android_vendor", "-C", "link-arg=-Wl,--error-limit=0",|' standalone-build/.cargo/config.toml
          rustup target add aarch64-linux-android
          (cd standalone-build && cargo fetch)
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p stubs
          cat > stubs/syms.txt <<'EOF'
          ACameraCaptureSession_abortCaptures
          ACameraCaptureSession_close
          ACameraCaptureSession_setRepeatingRequest
          ACameraCaptureSession_stopRepeating
          ACameraDevice_close
          ACameraDevice_createCaptureRequest
          ACamera
