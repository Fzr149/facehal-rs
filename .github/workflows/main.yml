name: build-facehal
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          sed -i '629a\                    thread::sleep(Duration::from_millis(60));' rust/service/src/session.rs
          sed -n '626,631p' rust/service/src/session.rs
      - name: build
        run: |
          rustup target add aarch64-linux-android
          (cd standalone-build && cargo fetch)
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sh scripts/build-production.sh
      - uses: actions/upload-artifact@v4
        with:
          name: facehal
          path: android.hardware.biometrics.face-service.facehal
